apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensqml
  namespace: sensqml
  labels:
    app: sensqml
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sensqml
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sensqml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: sensqml
          image: ghcr.io/sidd9923/sensqml:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SENSQML_RUN_DIR
              value: /artefacts
            - name: SENSQML_THRESHOLD
              value: "0.5"
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: model-artefacts
              mountPath: /artefacts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: model-artefacts
          persistentVolumeClaim:
            claimName: sensqml-artefacts-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: sensqml-svc
  namespace: sensqml
spec:
  selector:
    app: sensqml
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sensqml-hpa
  namespace: sensqml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sensqml
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sensqml-artefacts-pvc
  namespace: sensqml
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 2Gi
